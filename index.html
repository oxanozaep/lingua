<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingua">
<title>Lingua</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">L</span>
      <div>
        <div class="title" data-i18n="appName">Lingua</div>
        <div class="subtitle"><span id="langPairLabel"></span></div>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94a7.49 7.49 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.23-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.49 7.49 0 0 0 0 1.88L2.78 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.67.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.23 1.12-.55 1.62-.94l2.39.96c.25.1.53 0 .67-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.04-1.58zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
    </button>
  </header>

  <main id="screen"></main>

  <nav class="tabbar">
    <button class="tab active" data-screen="home">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>
      <span data-i18n="navHome">Inicio</span>
    </button>
    <button class="tab" data-screen="practice">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3 6 6 1-4.5 4.4L18 20l-6-3-6 3 1.5-6.6L3 9l6-1z"/></svg>
      <span data-i18n="navPractice">Practicar</span>
    </button>
    <button class="tab" data-screen="progress">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 21V3h2v16h16v2H3zm5-3v-7h3v7H8zm5 0V8h3v10h-3zm5 0v-5h3v5h-3z"/></svg>
      <span data-i18n="navProgress">Progreso</span>
    </button>
  </nav>
</div>

<div id="loading" class="loading"><div class="spinner"></div></div>

<script src="app.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
